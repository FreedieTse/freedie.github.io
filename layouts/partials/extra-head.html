<style>
  /* Fix weird space on top */
  body .container { justify-content: flex-start !important; }

  /* code blocks */
  pre {
    overflow-x: auto;
    padding: 1rem 1.25rem;
    border-radius: 8px;
    line-height: 1.5;
    font-size: 0.9rem;
  }
  pre code { white-space: pre; }
  code { padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.88em; }
  
  /* to remove the "fallback" button on top of "copy" */
  .code-toolbar .toolbar { display: none !important; }

  .copy-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    border: none;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    color: #ccc;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
  }

  /* inline code only — not code inside pre blocks */
  :not(pre) > code {
    background: rgba(255, 255, 255, 0.1);
    color: #e6e6e6;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: rgba(255,255,255,0.2); }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('pre').forEach(function (block) {
    if (block.querySelector('.copy-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.addEventListener('click', function () {
      const codeEl = block.querySelector('code') || block;
      const text = codeEl.innerText;
      const done = function () {
        btn.textContent = 'Copied!';
        setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
    });
    block.style.position = 'relative';
    block.appendChild(btn);
  });
});
</script>
